<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#083A85">
  <title>Shule AI Offline</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg, #083A85, #0B2F6B, #11B5B1); color: white; padding: 24px; }
    .card { width: min(440px, 100%); background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.24); border-radius: 28px; padding: 28px; box-shadow: 0 24px 60px rgba(0,0,0,.25); backdrop-filter: blur(16px); }
    h1 { margin: 0 0 10px; font-size: 1.8rem; }
    p { line-height: 1.55; opacity: .92; }
    button { min-height: 46px; border: 0; border-radius: 16px; padding: 0 18px; font-weight: 700; color: #083A85; background: white; }
  </style>
</head>
<body>
  <main class="card">
    <h1>You’re offline</h1>
    <p>Shule AI can’t reach the server right now. Check your internet connection, then try again. For payments, marks, attendance and reports, wait for confirmation before assuming anything was saved.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
